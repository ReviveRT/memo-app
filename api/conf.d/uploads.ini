; Upload limits for the API container. Copied to $PHP_INI_DIR/conf.d/ by the
; Dockerfile, which is outside /app and therefore not shadowed by the
; ./api:/app bind mount that compose uses for live editing.
;
; This file is not optional. Verified on php:8.3-cli and php:8.3-fpm: the
; official images ship no php.ini at all, so the compiled-in defaults apply --
; upload_max_filesize=2M, post_max_size=8M -- and both fail *silently* against
; a MAX_AUDIO_BYTES of 12 MiB:
;
;   * a 3.0 MB upload arrives as error=1 (UPLOAD_ERR_INI_SIZE), size=0, empty
;     tmp_name -- a truncated-looking file rather than a rejection;
;   * a 9.5 MB upload arrives with $_FILES *and* $_POST completely empty and no
;     error flag anywhere, because PHP discards the whole body once it exceeds
;     post_max_size. There is nothing left for a handler to branch on.
;
; MEMO-11 handles the second case at the edge (empty $_FILES with a large
; CONTENT_LENGTH => 413), but only these limits keep a legitimate memo out of
; that path in the first place.

; Both must exceed MAX_AUDIO_BYTES (12582912 = 12 MiB by default).
;
; post_max_size is the outer bound and must stay strictly above
; upload_max_filesize: a multipart body carries the boundary markers, the
; Content-Disposition headers and any other fields on top of the file itself,
; so a body sized exactly at the file cap still overflows.
;
; Raising MAX_AUDIO_BYTES past upload_max_filesize silently re-opens the bug
; above, so raise both here to match. GET /api/health reports the three numbers
; side by side and flags the mismatch rather than leaving it to be discovered by
; a failed recording.
;
; The gap between the two is also what makes an over-cap upload diagnosable.
; Verified against this image with a live multipart POST: at 3.0 MB and 9.5 MB the
; file arrives intact with error=0, and at 17 MB -- over upload_max_filesize but
; still under post_max_size -- $_FILES is populated with error=1
; (UPLOAD_ERR_INI_SIZE) rather than empty, so MEMO-11's handler has something to
; branch on and can answer 413. Set them to the same value and that case reverts
; to the silent empty-request failure instead.
upload_max_filesize = 16M
post_max_size = 20M

; One audio file per request. The default of 20 only widens the surface.
max_file_uploads = 1

; Uploads stream to a temp file on disk, so memory_limit does not need to cover
; the file. It does need to cover the process; the image default of 128M is
; left alone deliberately.
