; Where PHP's own errors go. Sibling of uploads.ini and copied to
; $PHP_INI_DIR/conf.d/ by the same Dockerfile line's directory.
;
; Not optional either, and for a sharper reason than uploads.ini. The official
; images ship no php.ini, so the *compiled-in* defaults apply -- and
; display_errors defaults to On. php.ini-production is what turns it off, and it
; is present in the image but not active. Two consequences, both observed against
; this container before this file existed:
;
;   1. A warning or fatal is written into the response body as HTML. The trace
;      names /app paths, vendor versions and the failing line -- through the web
;      container's proxy, to any caller.
;   2. Worse: emitting a warning sends the response headers, and they go out as
;      200. A fatal error immediately afterwards can no longer change the status,
;      so the request completes as "200 OK" with a stack trace as its body. The
;      compose healthcheck is `curl -fsS`, which only fails on a non-2xx, so it
;      passed -- and `web` started against an api container that could not serve a
;      single request.
;
; With display_errors off, that fatal is a bodiless 500, the healthcheck fails,
; and the detail is in `docker compose logs api` where it belongs.
display_errors = Off
display_startup_errors = Off

; Nothing is swallowed -- it moves to stderr, which Docker captures as the
; container's log stream. Explicit rather than left to the SAPI default, so where
; the only record of a 500 lands does not depend on the server FrankenPHP happens
; to be embedding.
log_errors = On
error_log = /dev/stderr

; E_ALL including deprecations. This is a dev-facing build and a deprecation now
; is a break on the next PHP minor.
error_reporting = E_ALL
