; Make the process environment visible to PHP.
;
; Laravel resolves env() through $_ENV and $_SERVER -- not getenv() -- so every
; value docker-compose.yml passes to this container reaches the application only
; if PHP populates those superglobals from the environment. That is what the "E"
; in variables_order does.
;
; Pinned rather than assumed. The compiled-in default happens to be "EGPCS", which
; is why this works with no php.ini loaded, but php.ini-production ships in this
; image (at $PHP_INI_DIR, inactive) and sets "GPCS" -- no E. Activating it, or any
; base-image change that starts loading a php.ini, would empty $_ENV of the
; container's variables.
;
; The failure mode is the worst kind: nothing errors. env('DATABASE_URL') returns
; null, config/database.php falls through to its per-field defaults, and the API
; quietly connects to whatever those describe -- or fails to, with a message that
; points at a host nobody configured. One line here removes the dependency on an
; absence.
variables_order = "EGPCS"
