<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Inline, so there is no favicon.ico to add to the repo and nothing for the dev
         server to answer 404 for (checked: /favicon.ico is a 404 here). It names the
         tab, which is worth one line on a page whose title is otherwise the only way
         to tell it from the other localhost tab this project makes you keep open. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='15'%3E%F0%9F%97%92%3C/text%3E%3C/svg%3E"
    />

    <title>Memo App</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
