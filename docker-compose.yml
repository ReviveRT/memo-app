# One command, no manual steps: `docker compose up` on a clean checkout.
#
# Two things in here are load-bearing and were both verified by reproducing the
# failure first:
#
#   1. Startup ordering is gated on health, not on process start. Plain
#      `depends_on` only waits for the container to exist, which lets `migrate`
#      race Postgres initdb (migrate exits non-zero, `api` never starts).
#      Fixed by the pg_isready healthcheck on `db` + `condition: service_healthy`,
#      and by `condition: service_completed_successfully` on `migrate` for the
#      two services that need the schema to exist.
#
#   2. Every value has a literal dev default inline. Compose interpolates from
#      `./.env` only — it never reads `.env.example` — so on a checkout with no
#      `.env` an unguarded ${POSTGRES_PASSWORD} is empty and Postgres exits 1
#      with "Database is uninitialized and superuser password is not specified".
#      Always `${VAR:-default}`, never `${VAR-default}`: only the colon form also
#      substitutes when the variable is set but empty, which is exactly what a
#      commented-out or blank line in someone's `.env` produces.
#
# Real API keys stay optional. The keyless path is the default path.
#
# MEMO-09 ran the whole of this from a fresh `git clone` with no `.env` and no keys,
# which is the first time every service in the graph existed at once. It converged
# unattended: `db` healthy, `migrate` applying both files and exiting 0, `api` and
# `web` healthy behind it, two `ai-worker` replicas polling. A memo typed into
# localhost:5173 was stored, claimed by a replica and reached `ready`.
#
# It was run twice, because the first pass proved less than it appeared to. A checkout
# can be spotlessly clean and the *build* still not be: 21 layers came from earlier
# tasks' images, so that pass said nothing about what a stranger's first
# `docker compose up` actually does. Anyone re-running this gate should assume the same
# trap. Repeated with `--no-cache` across all three Dockerfiles -- api 918MB, web 317MB,
# ai-worker 237MB, with the base images already pulled, which is the one thing still not
# measured here -- and every step above held identically on the images that came out.
#
# `docker compose down` and up again is the half worth recording, because it is the
# one this file cannot fix on its own: `migrate` restarts and re-runs, reports
# "schema up to date, nothing to apply", and leaves `applied_at` on both rows at the
# first run's timestamps. That is the ledger in db/migrate.sh holding, not the
# ordering here -- the ordering only guarantees the service runs, and running it
# twice is exactly what would break the stack without it.

name: memo-app

# Interpolated per use site, not at parse time, so an override in .env still wins.
x-database-url: &database-url ${DATABASE_URL:-postgresql://${POSTGRES_USER:-memo}:${POSTGRES_PASSWORD:-memo}@db:5432/${POSTGRES_DB:-memo}}
x-audio-dir: &audio-dir ${AUDIO_DIR:-/data/audio}

# Every container that touches the `audio` volume runs as this uid:gid (MEMO-12).
# One anchor, two services, because the volume is shared and unlink(2) checks the
# directory rather than the file: a worker on a different non-root uid can read
# every blob and delete none of them.
#
# Not overridable from .env on purpose. Both numbers are also build args in
# api/Dockerfile -- which creates the matching `memo` user and seeds the volume's
# mode from the image -- and in ai/Dockerfile as of MEMO-08, which creates the same
# user. A variable here would let the three drift apart, and the symptom of that is
# an EACCES on delete rather than anything that looks like a configuration error.
# Changing it means editing all three files and rebuilding.
#
# `user:` overrides the image's own USER, so it is also the backstop if either
# Dockerfile ever ships without one. Checked end to end once both existed: the api
# container writes a blob and the worker container reads and unlinks it, with
# /data/audio arriving drwxrwsr-x memo memo and /cache drwxr-xr-x memo memo.
x-audio-user: &audio-user "10001:10001"

services:
  # --- Postgres --------------------------------------------------------------
  # Pinned minor-series on purpose: an unpinned tag would move the on-disk
  # format under the pgdata volume between rebuilds.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memo}
      POSTGRES_DB: ${POSTGRES_DB:-memo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host-side only, for psql/GUI poking. Nothing in the stack uses it: the
      # other services reach Postgres as `db:5432` over the compose network.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # -h 127.0.0.1 is the whole point. During initdb the entrypoint runs a
      # temporary server with listen_addresses='' — reachable over the unix
      # socket but not TCP. A socket-based pg_isready therefore reports healthy
      # mid-initialization and re-opens the race this file exists to close.
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U ${POSTGRES_USER:-memo} -d ${POSTGRES_DB:-memo}"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # --- Schema ----------------------------------------------------------------
  # One-shot. Runs to completion, then `api` and `ai-worker` are released.
  # Uses the postgres image purely for its psql client — no build, no extra pull.
  # Re-running it on a second `docker compose up` must be a no-op; that
  # idempotence lives in the runner's schema_migrations ledger (MEMO-03), not here.
  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: *database-url
    volumes:
      - ./db:/db:ro
    # Invoked through sh so the script's exec bit on the host is irrelevant.
    entrypoint: ["sh", "/db/migrate.sh"]
    restart: "no"

  # --- PHP API ---------------------------------------------------------------
  # The only public surface. No AI dependencies in this container.
  api:
    build:
      context: ./api
    # Redundant with the image's own USER, and kept anyway: it puts both halves of
    # the shared-volume contract on one screen, and an api image that ships without
    # a USER line -- a bad rebase, a revert -- still gets held to it here rather
    # than quietly filling the volume with root-owned blobs the worker cannot
    # delete.
    #
    # What it does not do is rescue an image built before MEMO-12. Checked, rather
    # than assumed: forcing uid 10001 onto one of those exits at boot with "mkdir
    # /data/caddy/pki: permission denied", because the chowns that make non-root
    # work live in the image. That is the right failure -- immediate and in the logs
    # -- but it is a rebuild, not a fallback.
    user: *audio-user
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *database-url
      AUDIO_DIR: *audio-dir
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-12582912}
      # Where POST /api/ask proxies to (MEMO-24). A compose service name, so it
      # resolves on this network and nowhere else -- which is the whole of what
      # keeps ai-api private, since that service maps no host port.
      #
      # **`api` deliberately does not `depends_on` it.** Waiting for ai-api to be
      # healthy would gate the entire stack -- and therefore recording, listing and
      # searching memos -- on a 1.5 GB model finishing its load. Ask is one optional
      # feature; when it is not up, `/api/ask` answers a 503 saying so and nothing
      # else on the page notices. That is also what makes
      # `docker compose up --scale ai-api=0` a supported way to run this.
      AI_API_URL: ${AI_API_URL:-http://ai-api:8000}
      # Both timeouts are passed through for the reason OPENAI_API_KEY is passed to
      # ai-worker: they are documented in .env.example and listed in README.md, and
      # a variable somebody sets there has to reach the container that reads it
      # rather than being dropped one layer earlier. Left out of this block at
      # first, which made both of them settings that changed nothing.
      #
      # Short, because what it bounds is "ai-api is not running" and the useful
      # answer to that is a 503 now rather than in a minute.
      AI_API_CONNECT_TIMEOUT: ${AI_API_CONNECT_TIMEOUT:-5}
      # Per *read*, not for the whole answer -- Guzzle's `stream` option puts this on
      # the socket. It has to clear the gap before the first token, which is the
      # model processing the prompt, so it is set from the same order of magnitude as
      # ASK_DEADLINE_SECONDS and deliberately above it: ai-api giving up first
      # produces a readable `error` event, and this side giving up first produces a
      # truncated stream with nothing to explain it.
      AI_API_READ_TIMEOUT: ${AI_API_READ_TIMEOUT:-210}
      # FrankenPHP listens on :80 by default; the Vite proxy target is api:8080.
      SERVER_NAME: ":8080"
      # Laravel reads these. APP_KEY is deliberately absent: it exists for
      # encryption, cookies and signed URLs, and this API has none of those
      # (no auth, no sessions — MEMO-27 lists that as a deliberate cut). Verified
      # that every route works without it, so there is no dev key to commit and
      # nothing for a secret scan to find. Adding a feature that needs one means
      # running `php artisan key:generate` and putting it in .env, not here.
      APP_ENV: ${APP_ENV:-local}
      # Off even locally. A debug response body carries the stack trace and the
      # resolved configuration, and /api/* is reachable through the web
      # container's proxy. Detail goes to stderr instead.
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}

      # Whose memos are whose. Neither needs setting locally; both are forwarded so
      # that a value in .env is not a documented variable that quietly does nothing.
      # db/migrations/007_owners.sql has the design.
      OWNER_COOKIE: ${OWNER_COOKIE:-memo_owner}
      OWNER_COOKIE_DAYS: ${OWNER_COOKIE_DAYS:-400}

      # Recordings in a bucket rather than on the `audio` volume. Empty by default,
      # which is what compose wants -- the volume is shared between these containers
      # and is not ephemeral here. Forwarded anyway, and the worker gets the same six
      # values, so the two cannot end up pointed at different storage.
      # See deploy/README.md.
      AUDIO_BUCKET: ${AUDIO_BUCKET:-}
      AUDIO_BUCKET_ENDPOINT: ${AUDIO_BUCKET_ENDPOINT:-}
      AUDIO_BUCKET_KEY: ${AUDIO_BUCKET_KEY:-}
      AUDIO_BUCKET_SECRET: ${AUDIO_BUCKET_SECRET:-}
      AUDIO_BUCKET_REGION: ${AUDIO_BUCKET_REGION:-auto}
      AUDIO_BUCKET_PATH_STYLE: ${AUDIO_BUCKET_PATH_STYLE:-false}
    volumes:
      # Target repeats the default literally rather than using the anchor: a
      # YAML alias cannot be spliced into part of a scalar, and the mount point
      # has to move with AUDIO_DIR or the env var would point at nothing.
      - "audio:${AUDIO_DIR:-/data/audio}"
      - ./api:/app
      # Anonymous volume so the bind mount above does not shadow the vendor tree
      # composer installed into the image.
      - /app/vendor
      # Same reason, for Laravel's package manifest: `composer dump-autoload`
      # writes bootstrap/cache/packages.php during the build, and the bind mount
      # would replace it with the host's empty directory. Laravel would then
      # rebuild it into the mount on the first request, which works but writes
      # container state into the checkout.
      - /app/bootstrap/cache
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      # /api/health reports database connectivity (MEMO-05). `web` is gated on
      # this, so a healthy stack means the proxy target is actually answering.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # --- Frontend --------------------------------------------------------------
  web:
    build:
      context: ./web
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Service name, not localhost: localhost inside this container is the Vite
      # container itself. Same-origin proxying is the entire CORS answer.
      API_PROXY_TARGET: http://api:8080
    volumes:
      - ./web:/app
      # Anonymous volume over node_modules, or the bind mount above hides the tree npm
      # installed into the image. On a clean checkout that is not a subtle failure and
      # not a Vue one: the container exits immediately with "Error: Cannot find module
      # '/app/node_modules/.bin/vite'", because the command in web/Dockerfile is that
      # path. Reproduced by mounting a copy of ./web with node_modules removed.
      #
      # The trap it brings with it: compose carries an anonymous volume over to the
      # replacement container when it recreates a service, so after changing
      # web/package.json a plain `docker compose up --build` starts a new image with
      # the *old* node_modules. `docker compose up --build --renew-anon-volumes web`
      # is the fix, and `down -v` is the bigger hammer.
      - /app/node_modules
    ports:
      # Open http://localhost:5173, not a LAN IP — getUserMedia needs a secure
      # context and fails silently outside one.
      - "${WEB_PORT:-5173}:5173"
    healthcheck:
      # busybox wget, because node:alpine ships no curl. A 200 for / means the dev
      # server is listening and serving index.html — the one thing a human opening
      # localhost:5173 needs to be true.
      #
      # Nothing gates on this: `web` is the last service in the graph. It is here so
      # that `docker compose ps` tells the truth about the service the user actually
      # opens, and so MEMO-09's clean-checkout gate has something to wait for.
      #
      # What it does not prove, which is worth knowing before trusting it: it was run
      # against a container whose node_modules volume was left root-owned, and it
      # reported healthy while every dependency request 404'd and the page could not
      # boot Vue. `/` is served from the bind mount and needs none of that. A probe deep
      # enough to catch it would have to fetch an optimized dep by its hashed URL, which
      # changes on every dependency change; the api's healthcheck is the one carrying
      # real weight here, and `web` is gated on it.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  # --- Python worker ---------------------------------------------------------
  # Transcription and enrichment. Two replicas so a 30-second text memo does not
  # queue behind ten minutes of audio (MEMO-08). No container_name and no host
  # port mapping here — either one is incompatible with replicas > 1.
  ai-worker:
    build:
      context: ./ai
    # The other half of the audio contract (MEMO-12), and now a backstop rather than
    # the whole of it: ai/Dockerfile arrived with MEMO-08 and does all three things
    # this comment used to ask of it.
    #
    #   * a `memo` user at 10001:10001 in the image, so the numbers below resolve to
    #     a name and a bare `docker run` behaves the same way. Confirmed from inside
    #     the running container: `uid=10001(memo) gid=10001(memo)`.
    #   * /cache pre-created and owned by that user (HF_HOME below lives under it).
    #     An empty named volume inherits its mount point's owner from the image, so
    #     without it `model-cache` comes up root-owned and the non-root worker
    #     cannot write a model. It comes up drwxr-xr-x memo memo.
    #   * no AUDIO_DIR. An image without that path leaves an already-seeded volume
    #     alone, which is why the api image alone can own the mode -- one that
    #     created it under a different owner would win the seed whenever it started
    #     first, and these two services start concurrently. The ai image has no
    #     /data at all, checked directly against it.
    #
    #     What that does *not* mean, now that it has been run rather than reasoned
    #     about: starting ai-worker alone on a brand-new volume is not a no-op. With
    #     nothing in the image to seed from, Docker creates the mount point itself
    #     and /data/audio comes up root:root 0755. It heals on the next start where
    #     the volume is still empty -- bringing api up afterwards re-seeded it to
    #     drwxrwsr-x memo memo, carrying the api image's build mtime, which is the
    #     second row of the table in NOTES.md. Benign either way, because the worker
    #     only reads and unlinks and there is nothing there yet to read, but the
    #     window exists and this is where somebody would look for it.
    #
    # This line stays because `user:` overrides the image's own USER, so a bad rebase
    # or a revert that drops that USER is still held to the contract here rather than
    # quietly filling the volume with blobs the other container cannot delete.
    user: *audio-user
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *database-url
      AUDIO_DIR: *audio-dir
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-600}
      # Equal by default, which the worker collapses to a single provider rather
      # than a chain that would call the same one twice on every failure. The two
      # only differ if somebody sets one of them.
      STT_PROVIDER: ${STT_PROVIDER:-local}
      STT_FALLBACK: ${STT_FALLBACK:-local}
      # The whole of what transcription costs here, which is CPU time, disk and
      # RAM rather than money. `large-v3-turbo` is 1.6 GB on disk and 1.65 GB
      # resident per replica, peaking at 2.4 GB while a memo over two minutes long
      # decodes in batches — with `replicas: 2` below, budget for both. Drop to
      # `base` (142 MB) on a small machine, or run one replica. The README has the
      # accuracy each one actually delivers, measured rather than quoted.
      STT_MODEL: ${STT_MODEL:-large-v3-turbo}
      # Empty means detect it per recording, which is what lets one stack take
      # memos in more than one language. Detection runs on a `tiny` model rather
      # than the big one — a whole encoder pass cheaper, which halves a short memo
      # — so naming the language now saves only ~0.2s. Set it to remove the
      # chance of a wrong guess, not for the speed.
      STT_LANGUAGE: ${STT_LANGUAGE:-}
      # Only read when STT_PROVIDER (or STT_FALLBACK) is `groq`, which is not the
      # default — so on a clean checkout this passes an empty string into a
      # container that never looks at it, and `docker compose up` still needs no
      # key and no account.
      #
      # `${VAR:-}` rather than leaving the line out, so that setting it in a `.env`
      # is all it takes. memo_ai/config.py reads an empty string as an absence,
      # which is what makes the unset case reach the worker as "no key" rather than
      # as a key of zero characters that Groq would answer with a 401.
      #
      # **Setting this and STT_PROVIDER=groq uploads recordings to a third party.**
      # .env.example says so at the variable; README.md says so where somebody
      # picks a provider.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_STT_MODEL: ${GROQ_STT_MODEL:-whisper-large-v3-turbo}
      # Recordings in a bucket rather than on the `audio` volume. Empty by default,
      # which is what compose wants -- the volume is shared between these containers
      # and is not ephemeral here. Forwarded anyway so that `AUDIO_BUCKET=` in a
      # local .env actually reaches the process, rather than being a documented
      # variable that silently does nothing. See deploy/README.md.
      AUDIO_BUCKET: ${AUDIO_BUCKET:-}
      AUDIO_BUCKET_ENDPOINT: ${AUDIO_BUCKET_ENDPOINT:-}
      AUDIO_BUCKET_KEY: ${AUDIO_BUCKET_KEY:-}
      AUDIO_BUCKET_SECRET: ${AUDIO_BUCKET_SECRET:-}
      AUDIO_BUCKET_REGION: ${AUDIO_BUCKET_REGION:-auto}
      AUDIO_BUCKET_PATH_STYLE: ${AUDIO_BUCKET_PATH_STYLE:-false}
      # The enrichment pass — title, summary, tags, category (MEMO-21).
      #
      # `local` runs Qwen2.5-1.5B-Instruct in the worker process from the GGUF
      # baked into the image: no key, no account, no network, no extra service.
      # `none` turns the pass off, and memos still transcribe, store and search —
      # they get the heuristic title ai/memo_ai/titles.py cuts from the transcript
      # and NULL for the rest.
      #
      # Worth turning off on a small machine, which is the whole reason it is a
      # setting. The model is loaded lazily, on the first memo that needs
      # enriching rather than at boot, and adds about 1.7 GB to that replica's
      # RSS once it is — on top of the 1.65 GB whisper already holds.
      #
      # `replicas: 2` does not double all of it. 1.1 GB of that is the mmap-ed
      # weight file, which both replicas share in page cache; ~0.6 GB is the KV
      # cache and compute buffers, which each pays. So two enriching replicas
      # cost about 2.3 GB between them rather than 3.4.
      ENRICH_PROVIDER: ${ENRICH_PROVIDER:-local}
      #
      # **ENRICH_MODEL_PATH is deliberately absent from this list**, unlike every
      # other setting the worker reads, and adding it would break the case it
      # looks like it would help.
      #
      # ai/Dockerfile sets it as an image ENV holding the filename that build
      # chose. Any line here replaces that ENV — including the two forms that look
      # like they would not. Measured on Compose v5.0.2 against an image whose ENV
      # was set, with the variable unset in .env:
      #
      #   ENRICH_MODEL_PATH: ${ENRICH_MODEL_PATH:-}   ->  container sees ""
      #   ENRICH_MODEL_PATH:                          ->  container sees ""
      #
      # The bare key is documented as taking the value from the host environment,
      # and it does — but when there is nothing to take it passes an empty string
      # rather than omitting the variable, so the image's own value is gone either
      # way. The worker reads "" as absent and falls back to the default path,
      # which happens to be right for an unmodified build and silently wrong for
      # one made with `--build-arg ENRICH_MODEL_FILE=something-else.gguf`.
      #
      # So: to change the model, rebuild with that build arg — README.md has the
      # command. To point at a GGUF from outside the image, add the variable here
      # yourself, next to the bind mount you will also need.
      # How long a replica waits after finding an empty queue. Only ever a sleep on
      # the *idle* path: after a claim that found work the worker loops straight back
      # without waiting, so this is not a rate limit and it does not bound throughput.
      # It is roughly the delay between POST /api/memos and the row leaving `queued`.
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1.0}
      # Retries and the reaper (MEMO-16). Three attempts including the first,
      # counted by the claim statement rather than by the failure write — which is
      # what makes the bound hold when a memo kills its worker instead of failing.
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      # Base of the exponential backoff written to `next_attempt_at`: ~30s before
      # the second attempt, ~60s before the third, jittered ±20% so two replicas
      # that failed together do not retry together.
      RETRY_BACKOFF_SECONDS: ${RETRY_BACKOFF_SECONDS:-30}
      # How long a claim may be held before the reaper takes it back.
      #
      # It has one hard constraint: it must exceed the longest a healthy job can
      # run, or the reaper requeues work that is still in progress. At the defaults
      # above that ceiling is 3,300s — 180s of ffprobe and ffmpeg, 300s of model
      # load, a 2,400s decode deadline for a 600-second memo, and 420s of enrichment
      # — so 3,600 clears it by five minutes. On ENRICH_PROVIDER=none it is 2,880s
      # and the margin is twelve.
      #
      # The coupling is the part to remember: raising MAX_AUDIO_SECONDS lengthens the
      # decode deadline and this number has to follow, and so does turning enrichment
      # on. The worker recomputes the ceiling at boot and logs a warning naming both
      # numbers if it no longer fits, rather than leaving that to whoever edited
      # the .env.
      REAP_AFTER_SECONDS: ${REAP_AFTER_SECONDS:-3600}
      # How often each replica looks for expired leases. Separate from the poll
      # interval, which runs twice a second per replica — reaping writes against
      # every `processing` row and there is nothing to gain from doing it at that
      # rate. Both replicas running it concurrently is safe; see memo_ai/memos.py.
      REAPER_INTERVAL_SECONDS: ${REAPER_INTERVAL_SECONDS:-60}
      # Passed through and read by nothing. Transcription is local and free as of
      # MEMO-14, which built `local` and deliberately left the hosted adapter out
      # — the README says why. The line stays because the variable is documented
      # in .env.example and a key pasted there should reach the container that
      # would use it, rather than being silently dropped one layer earlier.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Where faster-whisper caches a model this image did not bake. MEMO-15 baked
      # the shipped ones -- `large-v3-turbo` and the `tiny` detector, at
      # /opt/models/whisper in the image -- so on the default configuration
      # nothing is ever written here and the worker never opens a socket to
      # HuggingFace. It fills up only if somebody sets STT_MODEL to something
      # else, which is the case this volume now exists for.
      #
      # This is what that comment predicted, recorded from the other side: the
      # volume has stopped being load-bearing. `docker volume rm
      # memo-app_model-cache` costs a reconfigured stack one re-download and costs
      # the shipped stack nothing at all.
      HF_HOME: /cache/huggingface
    volumes:
      - "audio:${AUDIO_DIR:-/data/audio}"
      - model-cache:/cache
    deploy:
      replicas: 2
    # Set rather than inherited, because the inherited value is not the documented
    # one. The Compose spec gives stop_grace_period a default of 10s; measured on
    # Compose v5.0.2, an unset grace period SIGKILLs a handler-less container after
    # 1.2s, and an explicit `10s` takes 10.2s. So the default here is ~1s.
    #
    # That matters because the worker handles SIGTERM specifically so the job in
    # flight finishes and writes its result (memo_ai/worker/__main__.py) -- and with
    # ~1s of grace that guarantee holds only while a job takes milliseconds.
    #
    # This comment used to say jobs finish in about 4 ms, which was true when the
    # worker only claimed a row and called a fake provider. MEMO-13 put ffmpeg in
    # front of that, so the number is now a real one: about 300 ms for a few
    # seconds of audio, and 11.2 s measured on a 34-minute input -- which is the
    # longest recording MAX_AUDIO_BYTES can admit at the bitrate the recorder asks
    # for. So 30s still covers the worst legitimate job, with margin, and it is no
    # longer covering it by three orders of magnitude.
    #
    # The case it does not cover is a pathological file that runs ffmpeg to its own
    # 120 s ceiling (NORMALIZE_TIMEOUT_SECONDS in memo_ai/audio.py). That job is
    # SIGKILLed mid-work and its row is left in `processing` -- which is now a reaper
    # case rather than a memo lost for good.
    #
    # 30s rather than MAX_AUDIO_SECONDS, and that is the deliberate version of the
    # number rather than a placeholder: a `docker compose down` that hangs for ten
    # minutes is not a better outcome than a reaped row. What it costs is bounded on
    # both sides now -- a job killed at 30s keeps whatever it had already committed,
    # so a memo cut off after transcription resumes at enrichment instead of being
    # transcribed again, and REAP_AFTER_SECONDS above is what eventually notices.
    stop_grace_period: 30s
    restart: unless-stopped

  # --- Ask my memos ------------------------------------------------------------
  # The sixth service, and the shape this file predicted for it: `build: context:
  # ./ai` again plus a `command:` override, because ai/Dockerfile's CMD is
  # `python -m memo_ai.worker` and memo_ai had room for a second entrypoint beside
  # it. One build context, one dependency set, one uid, two processes.
  #
  # **It is the one synchronous path in the stack**, and that is the contrast worth
  # understanding rather than an inconsistency to fix. Everything else queues,
  # because a memo is already saved and its transcript can arrive whenever it
  # arrives. A question has no row to come back to, so this request is held open
  # while a local model reads three memos and writes three sentences -- and the
  # architecture that rescues the rest of the app rescues nothing here. NOTES.md
  # compares the two.
  #
  # **What it costs while it is up.** The model is loaded at start and kept, on
  # purpose: this is the one path where a person is watching, so the first question
  # of the day must not be the one that waits out a load. Resident, that is 1,402 MB
  # of RSS -- of which only 310 MB is anonymous, because the 1,092 MB weight file is
  # mmap-ed read-only and is the *same file* every other process running this image
  # maps. Measured with smaps_rollup on two containers from this image with the
  # model up in both: Shared_Clean 1,117,840 kB and Private_Clean 0 on each.
  # README.md has the table and the comparison against a worker.
  #
  # Not wanted? `docker compose up --scale ai-api=0` and the rest of the stack is
  # unchanged -- `/api/ask` then answers a 503 saying so, and nothing else in the
  # app touches this service.
  ai-api:
    build:
      context: ./ai
    # The whole of the difference from ai-worker. Exec form, so python is PID 1 and
    # uvicorn's own SIGTERM handling gets the signal directly.
    command: ["python", "-m", "memo_ai.ask"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *database-url
      # ENRICH_MODEL_PATH is absent here for exactly the reason it is absent from
      # ai-worker above -- the paragraph there has the measurement. This service
      # opens the same GGUF, so the same trap applies: any line naming that variable
      # replaces the image's own ENV, including the two spellings that look like
      # they would not.
      #
      # How many memos go in front of the model, and how much of each.
      #
      # These two are the latency, near enough: prompt processing dominates CPU
      # inference, so what is retrieved is what is waited for. Three memos at 1,200
      # characters is about 3,600 characters of evidence. Raise them on a fast
      # machine; the service refuses a pair that would need more context than it
      # will load, at boot, naming both numbers.
      ASK_TOP_K: ${ASK_TOP_K:-3}
      ASK_MEMO_CHARS: ${ASK_MEMO_CHARS:-1200}
      # The ceiling on one answer. Loose against a measured worst case, for the
      # reason memo_ai/ask/model.py gives: it exists to stop a wedged generation
      # holding the one model this service has, not to enforce a latency target.
      # What bounds the felt wait is that the answer streams.
      ASK_DEADLINE_SECONDS: ${ASK_DEADLINE_SECONDS:-180}
      # Which backend answers, and `local` is the default here for the same reason
      # STT_PROVIDER=local is: a clean `docker compose up` must work with no account
      # and no key, and the weights this needs are already in the ai image.
      #
      # `groq` is the opt-in, and it is what deploy/Dockerfile sets -- not because it
      # is better on a laptop but because 1,117 MB of weights do not fit a free
      # tier's 512 MB. Setting it here sends the memos a question matched to a third
      # party, which is the trade to make knowingly rather than by default.
      ASK_PROVIDER: ${ASK_PROVIDER:-local}
      GROQ_ASK_MODEL: ${GROQ_ASK_MODEL:-llama-3.1-8b-instant}
      # Read only when ASK_PROVIDER=groq, and the same key STT_PROVIDER=groq uses --
      # there is deliberately no second one. Passed through here for the reason the
      # worker's copy of this line states: a key pasted into .env should reach the
      # container that would use it rather than being dropped one layer earlier.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    # **No ports.** PHP is the only public surface -- the browser reaches this
    # through `POST /api/ask` on the api container, which is what keeps CORS, auth
    # and rate limiting a question with one answer instead of two. To poke at it
    # directly, go in from a container that is already on this network:
    #
    #     docker compose exec api curl -s http://ai-api:8000/health
    #
    # **No `user:`, unlike the two services above.** That anchor is the shared-audio
    # contract and this service never mounts the audio volume -- it reads the memos
    # table and nothing else. The image still runs as `memo`; there is simply no
    # second container here to agree with about a uid.
    #
    # **No volumes at all**, for the same reason: the weights are baked into the
    # image (MEMO-15) and nothing here writes a file.
    healthcheck:
      # python rather than curl, because this image has no curl -- it is
      # python:3.12-slim plus ffmpeg. urllib is in the standard library and raises
      # on a non-2xx, which is exactly the exit code this needs.
      #
      # /health answers 503 until the weights are in, so `healthy` here means a
      # question could actually be answered rather than that a socket is open. The
      # start period covers the load: a fraction of a second on a warm page cache
      # and a few seconds cold, with retries behind it either way.
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Set rather than inherited, for the reason the worker's is: an unset grace
    # period SIGKILLs after ~1.2s on this Compose version, which would cut off an
    # answer mid-sentence on every `docker compose down`.
    #
    # 10s rather than the worker's 30s, and far under ASK_DEADLINE_SECONDS, because
    # what is at stake is different. A killed worker abandons a claim the reaper
    # then has to take back; a killed answer abandons nothing at all -- nothing on
    # this path writes to the database. So the number only buys a tidy ending for an
    # answer already in flight, and a `down` that waits three minutes for one would
    # be the worse trade.
    stop_grace_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  # Written by the PHP container, read and deleted by the Python one. Both agree on
  # uid/gid via x-audio-user above, and the directory arrives group-writable because
  # api/Dockerfile pre-creates it at 2775 and Docker copies an empty volume's mount
  # point -- owner, group and mode -- out of the image (MEMO-12).
  #
  # "Empty" is the load-bearing word, and it is not the same as "new": Docker
  # re-applies the image's owner and mode on any start where the volume is still
  # empty, so a volume left behind by a pre-MEMO-12 build heals itself on the next
  # `up`. A volume that already holds blobs from that build does not -- it stays
  # root:root 0755 and every upload fails. `docker compose down -v` is the reset.
  # NOTES.md has the four cases.
  audio:

  # Renamed from `whisper-cache` in MEMO-15, because it no longer holds whisper's
  # weights and mostly holds nothing at all: the shipped models are baked into the
  # ai image at /opt/models and this is where a model somebody opted into with
  # STT_MODEL lands instead.
  #
  # Renaming orphans the old volume rather than migrating it. That is the right
  # outcome -- its contents are the 1.6 GB the image now carries anyway -- but it
  # does not reclaim itself: `docker volume rm memo-app_whisper-cache` after the
  # first `up` on this revision, or `docker volume prune`. The README says so next
  # to the disk numbers.
  model-cache:
