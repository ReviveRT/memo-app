# One command, no manual steps: `docker compose up` on a clean checkout.
#
# Two things in here are load-bearing and were both verified by reproducing the
# failure first:
#
#   1. Startup ordering is gated on health, not on process start. Plain
#      `depends_on` only waits for the container to exist, which lets `migrate`
#      race Postgres initdb (migrate exits non-zero, `api` never starts).
#      Fixed by the pg_isready healthcheck on `db` + `condition: service_healthy`,
#      and by `condition: service_completed_successfully` on `migrate` for the
#      two services that need the schema to exist.
#
#   2. Every value has a literal dev default inline. Compose interpolates from
#      `./.env` only — it never reads `.env.example` — so on a checkout with no
#      `.env` an unguarded ${POSTGRES_PASSWORD} is empty and Postgres exits 1
#      with "Database is uninitialized and superuser password is not specified".
#      Always `${VAR:-default}`, never `${VAR-default}`: only the colon form also
#      substitutes when the variable is set but empty, which is exactly what a
#      commented-out or blank line in someone's `.env` produces.
#
# Real API keys stay optional. The keyless path is the default path.
#
# MEMO-09 ran the whole of this from a fresh `git clone` with no `.env` and no keys,
# which is the first time every service in the graph existed at once. It converged
# unattended: `db` healthy, `migrate` applying both files and exiting 0, `api` and
# `web` healthy behind it, two `ai-worker` replicas polling. A memo typed into
# localhost:5173 was stored, claimed by a replica and reached `ready`.
#
# It was run twice, because the first pass proved less than it appeared to. A checkout
# can be spotlessly clean and the *build* still not be: 21 layers came from earlier
# tasks' images, so that pass said nothing about what a stranger's first
# `docker compose up` actually does. Anyone re-running this gate should assume the same
# trap. Repeated with `--no-cache` across all three Dockerfiles -- api 918MB, web 317MB,
# ai-worker 237MB, with the base images already pulled, which is the one thing still not
# measured here -- and every step above held identically on the images that came out.
#
# `docker compose down` and up again is the half worth recording, because it is the
# one this file cannot fix on its own: `migrate` restarts and re-runs, reports
# "schema up to date, nothing to apply", and leaves `applied_at` on both rows at the
# first run's timestamps. That is the ledger in db/migrate.sh holding, not the
# ordering here -- the ordering only guarantees the service runs, and running it
# twice is exactly what would break the stack without it.

name: memo-app

# Interpolated per use site, not at parse time, so an override in .env still wins.
x-database-url: &database-url ${DATABASE_URL:-postgresql://${POSTGRES_USER:-memo}:${POSTGRES_PASSWORD:-memo}@db:5432/${POSTGRES_DB:-memo}}
x-audio-dir: &audio-dir ${AUDIO_DIR:-/data/audio}

# Every container that touches the `audio` volume runs as this uid:gid (MEMO-12).
# One anchor, two services, because the volume is shared and unlink(2) checks the
# directory rather than the file: a worker on a different non-root uid can read
# every blob and delete none of them.
#
# Not overridable from .env on purpose. Both numbers are also build args in
# api/Dockerfile -- which creates the matching `memo` user and seeds the volume's
# mode from the image -- and in ai/Dockerfile as of MEMO-08, which creates the same
# user. A variable here would let the three drift apart, and the symptom of that is
# an EACCES on delete rather than anything that looks like a configuration error.
# Changing it means editing all three files and rebuilding.
#
# `user:` overrides the image's own USER, so it is also the backstop if either
# Dockerfile ever ships without one. Checked end to end once both existed: the api
# container writes a blob and the worker container reads and unlinks it, with
# /data/audio arriving drwxrwsr-x memo memo and /cache drwxr-xr-x memo memo.
x-audio-user: &audio-user "10001:10001"

services:
  # --- Postgres --------------------------------------------------------------
  # Pinned minor-series on purpose: an unpinned tag would move the on-disk
  # format under the pgdata volume between rebuilds.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memo}
      POSTGRES_DB: ${POSTGRES_DB:-memo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host-side only, for psql/GUI poking. Nothing in the stack uses it: the
      # other services reach Postgres as `db:5432` over the compose network.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # -h 127.0.0.1 is the whole point. During initdb the entrypoint runs a
      # temporary server with listen_addresses='' — reachable over the unix
      # socket but not TCP. A socket-based pg_isready therefore reports healthy
      # mid-initialization and re-opens the race this file exists to close.
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U ${POSTGRES_USER:-memo} -d ${POSTGRES_DB:-memo}"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # --- Schema ----------------------------------------------------------------
  # One-shot. Runs to completion, then `api` and `ai-worker` are released.
  # Uses the postgres image purely for its psql client — no build, no extra pull.
  # Re-running it on a second `docker compose up` must be a no-op; that
  # idempotence lives in the runner's schema_migrations ledger (MEMO-03), not here.
  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: *database-url
    volumes:
      - ./db:/db:ro
    # Invoked through sh so the script's exec bit on the host is irrelevant.
    entrypoint: ["sh", "/db/migrate.sh"]
    restart: "no"

  # --- PHP API ---------------------------------------------------------------
  # The only public surface. No AI dependencies in this container.
  api:
    build:
      context: ./api
    # Redundant with the image's own USER, and kept anyway: it puts both halves of
    # the shared-volume contract on one screen, and an api image that ships without
    # a USER line -- a bad rebase, a revert -- still gets held to it here rather
    # than quietly filling the volume with root-owned blobs the worker cannot
    # delete.
    #
    # What it does not do is rescue an image built before MEMO-12. Checked, rather
    # than assumed: forcing uid 10001 onto one of those exits at boot with "mkdir
    # /data/caddy/pki: permission denied", because the chowns that make non-root
    # work live in the image. That is the right failure -- immediate and in the logs
    # -- but it is a rebuild, not a fallback.
    user: *audio-user
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *database-url
      AUDIO_DIR: *audio-dir
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-12582912}
      # FrankenPHP listens on :80 by default; the Vite proxy target is api:8080.
      SERVER_NAME: ":8080"
      # Laravel reads these. APP_KEY is deliberately absent: it exists for
      # encryption, cookies and signed URLs, and this API has none of those
      # (no auth, no sessions — MEMO-27 lists that as a deliberate cut). Verified
      # that every route works without it, so there is no dev key to commit and
      # nothing for a secret scan to find. Adding a feature that needs one means
      # running `php artisan key:generate` and putting it in .env, not here.
      APP_ENV: ${APP_ENV:-local}
      # Off even locally. A debug response body carries the stack trace and the
      # resolved configuration, and /api/* is reachable through the web
      # container's proxy. Detail goes to stderr instead.
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
    volumes:
      # Target repeats the default literally rather than using the anchor: a
      # YAML alias cannot be spliced into part of a scalar, and the mount point
      # has to move with AUDIO_DIR or the env var would point at nothing.
      - "audio:${AUDIO_DIR:-/data/audio}"
      - ./api:/app
      # Anonymous volume so the bind mount above does not shadow the vendor tree
      # composer installed into the image.
      - /app/vendor
      # Same reason, for Laravel's package manifest: `composer dump-autoload`
      # writes bootstrap/cache/packages.php during the build, and the bind mount
      # would replace it with the host's empty directory. Laravel would then
      # rebuild it into the mount on the first request, which works but writes
      # container state into the checkout.
      - /app/bootstrap/cache
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      # /api/health reports database connectivity (MEMO-05). `web` is gated on
      # this, so a healthy stack means the proxy target is actually answering.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # --- Frontend --------------------------------------------------------------
  web:
    build:
      context: ./web
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Service name, not localhost: localhost inside this container is the Vite
      # container itself. Same-origin proxying is the entire CORS answer.
      API_PROXY_TARGET: http://api:8080
    volumes:
      - ./web:/app
      # Anonymous volume over node_modules, or the bind mount above hides the tree npm
      # installed into the image. On a clean checkout that is not a subtle failure and
      # not a Vue one: the container exits immediately with "Error: Cannot find module
      # '/app/node_modules/.bin/vite'", because the command in web/Dockerfile is that
      # path. Reproduced by mounting a copy of ./web with node_modules removed.
      #
      # The trap it brings with it: compose carries an anonymous volume over to the
      # replacement container when it recreates a service, so after changing
      # web/package.json a plain `docker compose up --build` starts a new image with
      # the *old* node_modules. `docker compose up --build --renew-anon-volumes web`
      # is the fix, and `down -v` is the bigger hammer.
      - /app/node_modules
    ports:
      # Open http://localhost:5173, not a LAN IP — getUserMedia needs a secure
      # context and fails silently outside one.
      - "${WEB_PORT:-5173}:5173"
    healthcheck:
      # busybox wget, because node:alpine ships no curl. A 200 for / means the dev
      # server is listening and serving index.html — the one thing a human opening
      # localhost:5173 needs to be true.
      #
      # Nothing gates on this: `web` is the last service in the graph. It is here so
      # that `docker compose ps` tells the truth about the service the user actually
      # opens, and so MEMO-09's clean-checkout gate has something to wait for.
      #
      # What it does not prove, which is worth knowing before trusting it: it was run
      # against a container whose node_modules volume was left root-owned, and it
      # reported healthy while every dependency request 404'd and the page could not
      # boot Vue. `/` is served from the bind mount and needs none of that. A probe deep
      # enough to catch it would have to fetch an optimized dep by its hashed URL, which
      # changes on every dependency change; the api's healthcheck is the one carrying
      # real weight here, and `web` is gated on it.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  # --- Python worker ---------------------------------------------------------
  # Transcription and enrichment. Two replicas so a 30-second text memo does not
  # queue behind ten minutes of audio (MEMO-08). No container_name and no host
  # port mapping here — either one is incompatible with replicas > 1.
  ai-worker:
    build:
      context: ./ai
    # The other half of the audio contract (MEMO-12), and now a backstop rather than
    # the whole of it: ai/Dockerfile arrived with MEMO-08 and does all three things
    # this comment used to ask of it.
    #
    #   * a `memo` user at 10001:10001 in the image, so the numbers below resolve to
    #     a name and a bare `docker run` behaves the same way. Confirmed from inside
    #     the running container: `uid=10001(memo) gid=10001(memo)`.
    #   * /cache pre-created and owned by that user (HF_HOME below lives under it).
    #     An empty named volume inherits its mount point's owner from the image, so
    #     without it `whisper-cache` comes up root-owned and the non-root worker
    #     cannot write a model. It comes up drwxr-xr-x memo memo.
    #   * no AUDIO_DIR. An image without that path leaves an already-seeded volume
    #     alone, which is why the api image alone can own the mode -- one that
    #     created it under a different owner would win the seed whenever it started
    #     first, and these two services start concurrently. The ai image has no
    #     /data at all, checked directly against it.
    #
    #     What that does *not* mean, now that it has been run rather than reasoned
    #     about: starting ai-worker alone on a brand-new volume is not a no-op. With
    #     nothing in the image to seed from, Docker creates the mount point itself
    #     and /data/audio comes up root:root 0755. It heals on the next start where
    #     the volume is still empty -- bringing api up afterwards re-seeded it to
    #     drwxrwsr-x memo memo, carrying the api image's build mtime, which is the
    #     second row of the table in NOTES.md. Benign either way, because the worker
    #     only reads and unlinks and there is nothing there yet to read, but the
    #     window exists and this is where somebody would look for it.
    #
    # This line stays because `user:` overrides the image's own USER, so a bad rebase
    # or a revert that drops that USER is still held to the contract here rather than
    # quietly filling the volume with blobs the other container cannot delete.
    user: *audio-user
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *database-url
      AUDIO_DIR: *audio-dir
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-600}
      STT_PROVIDER: ${STT_PROVIDER:-local}
      STT_FALLBACK: ${STT_FALLBACK:-local}
      STT_MODEL: ${STT_MODEL:-base}
      ENRICH_MODEL: ${ENRICH_MODEL:-claude-opus-5}
      # How long a replica waits after finding an empty queue. Only ever a sleep on
      # the *idle* path: after a claim that found work the worker loops straight back
      # without waiting, so this is not a rate limit and it does not bound throughput.
      # It is roughly the delay between POST /api/memos and the row leaving `queued`.
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1.0}
      # Deliberately defaulted to empty rather than left unset: the container
      # sees a defined-but-blank key and takes the local path.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Weights are baked into the image (MEMO-15); this volume only keeps a
      # rebuild from refetching anything that was not baked.
      HF_HOME: /cache/huggingface
    volumes:
      - "audio:${AUDIO_DIR:-/data/audio}"
      - whisper-cache:/cache
    deploy:
      replicas: 2
    # Set rather than inherited, because the inherited value is not the documented
    # one. The Compose spec gives stop_grace_period a default of 10s; measured on
    # Compose v5.0.2, an unset grace period SIGKILLs a handler-less container after
    # 1.2s, and an explicit `10s` takes 10.2s. So the default here is ~1s.
    #
    # That matters because the worker handles SIGTERM specifically so the job in
    # flight finishes and writes its result (memo_ai/worker/__main__.py) -- and with
    # ~1s of grace that guarantee holds only while a job takes milliseconds.
    #
    # This comment used to say jobs finish in about 4 ms, which was true when the
    # worker only claimed a row and called a fake provider. MEMO-13 put ffmpeg in
    # front of that, so the number is now a real one: about 300 ms for a few
    # seconds of audio, and 11.2 s measured on a 34-minute input -- which is the
    # longest recording MAX_AUDIO_BYTES can admit at the bitrate the recorder asks
    # for. So 30s still covers the worst legitimate job, with margin, and it is no
    # longer covering it by three orders of magnitude.
    #
    # The case it does not cover is a pathological file that runs ffmpeg to its own
    # 120 s ceiling (NORMALIZE_TIMEOUT_SECONDS in memo_ai/audio.py). That job is
    # SIGKILLed mid-work and its row is left in `processing` -- which is a reaper
    # case, and the reaper is MEMO-16's.
    #
    # 30s rather than MAX_AUDIO_SECONDS: a `docker compose down` that hangs for ten
    # minutes is not a better outcome than a reaped row, and reaping is what MEMO-16
    # builds for exactly this case. That task owns the deliberate version of this
    # number, together with the reaper's own threshold -- which has to stay above it.
    stop_grace_period: 30s
    restart: unless-stopped

  # A sixth service, ai-api, joins this file only if "Ask my memos" lands (MEMO-24).
  # It shares the ai image with a different entrypoint -- concretely, `build:
  # context: ./ai` again plus a `command:` override, since ai/Dockerfile's CMD is
  # `python -m memo_ai.worker` and memo_ai is one package with room for a second
  # entrypoint beside it.

volumes:
  pgdata:
  # Written by the PHP container, read and deleted by the Python one. Both agree on
  # uid/gid via x-audio-user above, and the directory arrives group-writable because
  # api/Dockerfile pre-creates it at 2775 and Docker copies an empty volume's mount
  # point -- owner, group and mode -- out of the image (MEMO-12).
  #
  # "Empty" is the load-bearing word, and it is not the same as "new": Docker
  # re-applies the image's owner and mode on any start where the volume is still
  # empty, so a volume left behind by a pre-MEMO-12 build heals itself on the next
  # `up`. A volume that already holds blobs from that build does not -- it stays
  # root:root 0755 and every upload fails. `docker compose down -v` is the reset.
  # NOTES.md has the four cases.
  audio:
  whisper-cache:
